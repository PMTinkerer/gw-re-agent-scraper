name: Incremental Active Listings (no email)

on:
  schedule:
    # Weekdays only (Lucas, 2026-10-04): outreach sends Mon-Fri, so weekend scans
    # would spend credits without being used. Still gated by INCREMENTAL_ACTIVE_ENABLED.
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
    inputs:
      finalization:
        description: 'Temporary operator-approved 5000-unit daily testing ceiling (manual only)'
        required: false
        default: false
        type: boolean
      one_time_approval:
        description: 'Optional exact ID of a recorded, single-use operator approval'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: maine-listings
  cancel-in-progress: false

jobs:
  refresh:
    # Deliberately OFF until operator billing and first-run acceptance are verified.
    if: vars.INCREMENTAL_ACTIVE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && vars.INCREMENTAL_ACTIVE_CANARY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Configure reservation identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Incremental refresh with durable reservations
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ONE_TIME_APPROVAL: ${{ inputs.one_time_approval }}
          FINALIZATION: ${{ inputs.finalization }}
        run: |
          args=()
          if [ "$FINALIZATION" = "true" ]; then args+=(--finalization); fi
          python -m src.incremental_main --billing-proof config/active-refresh-billing.json --github-publish --one-time-approval "$ONE_TIME_APPROVAL" "${args[@]}"
      - name: Retain bounded summary diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: active-refresh-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .firecrawl/active-refresh-diagnostics/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
