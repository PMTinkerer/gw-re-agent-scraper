name: Incremental Active Listings (no email)

on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maine-listings
  cancel-in-progress: false

jobs:
  refresh:
    # Deliberately OFF until operator billing and first-run acceptance are verified.
    if: vars.INCREMENTAL_ACTIVE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && vars.INCREMENTAL_ACTIVE_CANARY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Configure reservation identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Incremental refresh with durable reservations
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python -m src.incremental_main --billing-proof config/active-refresh-billing.json --github-publish
